name: kyco_mobile
description: "Kyco mobile app (iOS/Android) — consumes the kyco /api/v1 backend."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  dio: ^5.11.0
  flutter_riverpod: ^2.6.1
  flutter_secure_storage: ^11.0.0
  go_router: ^18.0.0
  intl: ^0.20.3
  shared_preferences: ^2.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.1
  flutter_native_splash: ^2.4.4
  device_preview: ^1.2.0

flutter:
  uses-material-design: true
  generate: true

# Branded launcher icons for iOS + Android (adaptive). Regenerate with:
#   dart run flutter_launcher_icons
flutter_launcher_icons:
  image_path: "assets/icon/icon.png"
  android: true
  ios: true
  remove_alpha_ios: true
  adaptive_icon_background: "#0284C7"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
  min_sdk_android: 24

# Branded native splash (replaces the default white Flutter launch screen).
#   dart run flutter_native_splash:create
flutter_native_splash:
  color: "#0284C7"
  image: assets/icon/icon_foreground.png
  android: true
  ios: true
  android_12:
    color: "#0284C7"
    image: assets/icon/icon_foreground.png
