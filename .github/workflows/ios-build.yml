name: iOS build

# Builds the Kyco Flutter app for iOS on a macOS runner (iOS binaries can't be
# built on Linux). By default it produces an UNSIGNED .ipa artifact — no Apple
# account or secrets required, useful as a CI gate that the iOS build compiles
# and for resigning/sideload flows. When the signing secrets below are present
# it produces a SIGNED .ipa instead (ready for Ad Hoc / TestFlight upload).
#
# Signed build is enabled automatically once these repo secrets exist
# (Settings → Secrets and variables → Actions):
#   IOS_CERTIFICATE_BASE64          base64 of your Apple distribution cert .p12
#   IOS_CERTIFICATE_PASSWORD        password used when exporting that .p12
#   IOS_PROVISIONING_PROFILE_BASE64 base64 of the matching .mobileprovision
#   IOS_KEYCHAIN_PASSWORD           any throwaway password for the temp keychain
#   IOS_EXPORT_OPTIONS_PLIST        base64 of your ExportOptions.plist
# See docs/ios-github-actions.md for how to generate each one.

on:
  push:
    branches: [ master, main ]
    paths:
      - 'lib/**'
      - 'ios/**'
      - 'test/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.github/workflows/ios-build.yml'
  pull_request:
    paths:
      - 'lib/**'
      - 'ios/**'
      - 'pubspec.yaml'
  workflow_dispatch:
    inputs:
      api_base:
        description: 'API_BASE passed as --dart-define (backend the app talks to)'
        default: 'https://kyco.vn/api/v1'
        required: false

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios:
    # macos-15 so the build uses Xcode 16 / an iOS 18+ SDK — App Store Connect
    # rejects binaries not built with the iOS 18 SDK. macos-14 defaults to
    # Xcode 15.4 (iOS 17.5 SDK) and would be rejected at upload.
    runs-on: macos-15        # Apple Silicon, Xcode 16.x + CocoaPods preinstalled
    timeout-minutes: 45
    env:
      API_BASE: ${{ github.event.inputs.api_base || 'https://kyco.vn/api/v1' }}
      # Signed build runs only when ALL FIVE signing secrets are set; otherwise
      # unsigned. A partial secret set (e.g. cert without its password, or no
      # keychain password) must fall back to the unsigned path — the signed path
      # would otherwise die at `security import`.
      HAS_SIGNING: ${{ secrets.IOS_CERTIFICATE_BASE64 != '' && secrets.IOS_CERTIFICATE_PASSWORD != '' && secrets.IOS_PROVISIONING_PROFILE_BASE64 != '' && secrets.IOS_KEYCHAIN_PASSWORD != '' && secrets.IOS_EXPORT_OPTIONS_PLIST != '' }}
    steps:
      - uses: actions/checkout@v4

      # Pin Xcode explicitly so the SDK doesn't silently drift with the runner
      # image. 16.4 ships on the macos-15 image and provides the iOS 18.5 SDK.
      - name: Select Xcode 16.4
        run: sudo xcode-select -s /Applications/Xcode_16.4.app

      - name: Set up Flutter 3.47.2
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: Toolchain versions
        run: |
          flutter --version
          xcodebuild -version
          pod --version

      - name: Resolve dependencies
        run: flutter pub get

      - name: Analyze (static analysis gate)
        run: flutter analyze

      - name: Unit tests
        run: flutter test

      # ── UNSIGNED build (default — no Apple account / secrets needed) ──────────
      - name: Build iOS app (unsigned)
        if: env.HAS_SIGNING != 'true'
        run: flutter build ios --release --no-codesign --dart-define=API_BASE=$API_BASE

      - name: Package unsigned IPA
        if: env.HAS_SIGNING != 'true'
        run: |
          set -euo pipefail
          cd build/ios/iphoneos
          rm -rf Payload && mkdir Payload
          cp -R Runner.app Payload/
          zip -qry9 "$GITHUB_WORKSPACE/kyco-mobile-unsigned.ipa" Payload
          cd "$GITHUB_WORKSPACE"
          ls -lh kyco-mobile-unsigned.ipa

      - name: Upload unsigned IPA
        if: env.HAS_SIGNING != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: kyco-mobile-ios-unsigned
          path: kyco-mobile-unsigned.ipa
          if-no-files-found: error
          retention-days: 14

      # ── SIGNED build (runs automatically once signing secrets exist) ─────────
      - name: Install signing certificate & provisioning profile
        if: env.HAS_SIGNING == 'true'
        env:
          CERT_B64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          CERT_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          PROFILE_B64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.IOS_KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          CERT_PATH="$RUNNER_TEMP/cert.p12"
          PROFILE_PATH="$RUNNER_TEMP/profile.mobileprovision"
          KEYCHAIN="$RUNNER_TEMP/app-signing.keychain-db"
          echo -n "$CERT_B64" | base64 --decode -o "$CERT_PATH"
          echo -n "$PROFILE_B64" | base64 --decode -o "$PROFILE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$CERT_PATH" -P "$CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychain -d user -s "$KEYCHAIN" login.keychain-db
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$PROFILE_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/"

      - name: Write ExportOptions.plist
        if: env.HAS_SIGNING == 'true'
        run: echo -n '${{ secrets.IOS_EXPORT_OPTIONS_PLIST }}' | base64 --decode -o "$RUNNER_TEMP/ExportOptions.plist"

      - name: Build signed IPA
        if: env.HAS_SIGNING == 'true'
        run: |
          flutter build ipa --release \
            --dart-define=API_BASE=$API_BASE \
            --export-options-plist="$RUNNER_TEMP/ExportOptions.plist"

      - name: Upload signed IPA
        if: env.HAS_SIGNING == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: kyco-mobile-ios-signed
          path: build/ios/ipa/*.ipa
          if-no-files-found: error
          retention-days: 14
